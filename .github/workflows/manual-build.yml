name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # --- 修改开始：MacOS 配置改为 x64 ---
          - os: macos-13  # macos-13 是目前 GitHub 稳定的 Intel (x64) runner
            arch: x64
            platform: macos
          # --- 修改结束 ---
          # 注释掉 arm64/latest 以只构建 x64，或者你可以保留两者
          # - os: macos-latest
          #   arch: arm64
          #   platform: macos
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Check platform selection
        if: github.event.inputs.platform != 'all' && github.event.inputs.platform != matrix.platform
        run: exit 0

      - name: Checkout repository
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Import Code-Signing Certificates (macOS)
        # 这里的判断改为 matrix.platform == 'macos' 更通用
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos') && matrix.platform == 'macos'
        uses: Apple-Actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Install dependencies
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild Windows native modules
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') && matrix.os == 'windows-latest'
        run: pnpm rebuild electron-winstaller @bitdisaster/exe-icon-extractor electron-wix-msi

      - name: Generate paraglide files
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Build workspace packages
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        run: pnpm --filter @302ai/studio-plugin-sdk run build

      - name: Run quality checks
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        run: |
          npx eslint electron/main/
          pnpm run check

      - name: Build application
        if: github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.platform
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          NODE_ENV: production
          # macOS 签名和公证环境变量
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run make

      - name: Upload Windows artifacts
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_number }}
          path: |
            out/make/squirrel.windows/**/*
            out/make/zip/win32/**/*

      # --- 修改开始：MacOS 上传条件 ---
      - name: Upload macOS artifacts
        # 关键修改：不再检查 matrix.os == 'macos-latest'，而是检查 matrix.platform == 'macos'
        # 这样无论是 macos-13 还是 macos-latest 都能上传
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos') && matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          # 在名字里加上 x64 方便区分，如果你还构建 arm64 可以加上 ${{ matrix.arch }}
          name: macos-x64-build-${{ github.run_number }}
          path: |
            out/make/*.dmg
            out/make/zip/**/*
      # --- 修改结束 ---

      - name: Upload Linux artifacts
        if: (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ github.run_number }}
          path: |
            out/make/deb/**/*
            out/make/rpm/**/*
