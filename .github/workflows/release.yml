name: Release

on:
    push:
        tags:
            - "v*.*.*"
            - "v*.*.*-beta"
            - "v*.*.*-beta.*"

permissions:
    contents: write

env:
    UPDATE_SERVER_URL: https://updater.302.ai
    NODE_OPTIONS: --max-old-space-size=8192

jobs:
    # Job 1: Preparation - Parse version, quality checks, create Draft Release
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            channel: ${{ steps.version.outputs.channel }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Parse version and channel
              id: version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  if [[ "$VERSION" == *"-beta"* ]]; then
                    echo "channel=beta" >> $GITHUB_OUTPUT
                  else
                    echo "channel=stable" >> $GITHUB_OUTPUT
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Generate paraglide files
              run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

            # Ensure code quality before starting expensive builds
            - name: Run quality checks
              run: |
                  npx eslint electron/main/
                  pnpm run check

            # Create GitHub Release early to avoid duplicate creation across platforms
            - name: Create GitHub release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION=${GITHUB_REF#refs/tags/}
                  PRERELEASE_FLAG=""
                  [[ "$VERSION" == *"-beta"* ]] && PRERELEASE_FLAG="--prerelease"
                  if ! gh release view "$VERSION" >/dev/null 2>&1; then
                    gh release create "$VERSION" --title "$VERSION" --notes "Release $VERSION" $PRERELEASE_FLAG
                  fi

            # Create release record on the update server
            - name: Create release on update server
              run: |
                  curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ steps.version.outputs.channel }}/releases" \
                    -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                    -H "Content-Type: application/json" \
                    -d "{\"version\": \"${{ steps.version.outputs.version }}\", \"notes\": \"Release ${{ steps.version.outputs.version }}\"}"

    # Job 2: Build and Upload - Parallel execution across platforms
    release:
        needs: prepare
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: macos-latest-xlarge
                      arch: arm64
                    - os: macos-15-large
                      arch: x64
                    - os: ubuntu-latest
                      arch: x64
                    - os: windows-latest
                      arch: x64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Import Code-Signing Certificates (macOS)
              if: startsWith(matrix.os, 'macos')
              uses: Apple-Actions/import-codesign-certs@v5
              with:
                  p12-file-base64: ${{ secrets.MAC_CERTS }}
                  p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Rebuild Windows native modules
              if: startsWith(matrix.os, 'windows')
              run: pnpm rebuild electron-winstaller @bitdisaster/exe-icon-extractor electron-wix-msi

            - name: Generate paraglide files
              run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

            - name: Build shared packages
              run: pnpm --filter @302ai/studio-plugin-sdk run build

            # Only perform build, quality checks already completed in the prepare Job
            - name: Build Project
              run: pnpm run build

            - name: Build and publish to GitHub
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_ENV: production
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: pnpm run publish

            # Upload to update server - Enhanced error handling and explicit type specification
            - name: Upload macOS artifacts
              if: startsWith(matrix.os, 'macos')
              run: |
                  ZIP_FILE=$(find out/make/zip/darwin -name "*.zip" -type f | head -1)
                  if [ -n "$ZIP_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${ZIP_FILE}" -F "platform=darwin" -F "arch=${{ matrix.arch }}" -F "artifact_type=zip"
                  fi
                  DMG_FILE=$(find out/make -maxdepth 1 -name "*.dmg" -type f | head -1)
                  if [ -n "$DMG_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${DMG_FILE}" -F "platform=darwin" -F "arch=${{ matrix.arch }}" -F "artifact_type=dmg"
                  fi

            - name: Upload Windows artifacts
              if: startsWith(matrix.os, 'windows')
              shell: bash
              run: |
                  SETUP_FILE=$(find out/make/squirrel.windows -name "*Setup.exe" -type f | head -1)
                  if [ -n "$SETUP_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${SETUP_FILE}" -F "platform=win32" -F "arch=${{ matrix.arch }}" -F "artifact_type=exe"
                  fi
                  NUPKG_FILE=$(find out/make/squirrel.windows -name "*-full.nupkg" -type f | head -1)
                  if [ -n "$NUPKG_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${NUPKG_FILE}" -F "platform=win32" -F "arch=${{ matrix.arch }}" -F "artifact_type=nupkg"
                  fi

            - name: Upload Linux artifacts
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                  DEB_FILE=$(find out/make/deb -name "*.deb" -type f | head -1)
                  if [ -n "$DEB_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${DEB_FILE}" -F "platform=linux" -F "arch=${{ matrix.arch }}" -F "artifact_type=deb"
                  fi
                  RPM_FILE=$(find out/make/rpm -name "*.rpm" -type f | head -1)
                  if [ -n "$RPM_FILE" ]; then
                    curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/upload" \
                      -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}" \
                      -F "file=@${RPM_FILE}" -F "platform=linux" -F "arch=${{ matrix.arch }}" -F "artifact_type=rpm"
                  fi

            # Upload artifacts to GitHub Job (for backup/debugging)
            - name: Upload artifacts to GitHub
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-${{ matrix.arch }}-artifacts
                  path: |
                      out/make/**/*
                      out/make/zip/**/*

    # Job 3: Publication - Switch release status after all uploads are complete
    publish:
        needs: [prepare, release]
        runs-on: ubuntu-latest
        steps:
            - name: Publish release on update server
              run: |
                  curl -vk --fail-with-body -X POST "${UPDATE_SERVER_URL}/api/channels/${{ needs.prepare.outputs.channel }}/releases/${{ needs.prepare.outputs.version }}/publish" \
                    -H "X-API-Key: ${{ secrets.UPDATE_API_KEY }}"

                  echo "Release published successfully on update server!"
