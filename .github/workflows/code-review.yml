name: AI Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened]
        # Trigger on PRs targeting dev/* branches
        branches:
            - "dev/*"

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    claude-code-review:
        runs-on: ubuntu-latest
        # Only review PRs from feature branches, skip dependabot and automated PRs
        # Supported branch prefixes: feat/ fix/ refactor/ perf/ docs/ style/ test/ chore/ ci/ build/
        if: |
            !startsWith(github.head_ref, 'dev/') &&
            !startsWith(github.head_ref, 'develop') &&
            !startsWith(github.head_ref, 'master') &&
            !startsWith(github.head_ref, 'release/') &&
            github.actor != 'dependabot[bot]'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
              env:
                  NODE_OPTIONS: --max-old-space-size=8192

            - name: Run AI Code Review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Use third-party API endpoint (e.g., 302.AI proxy)
                  # Set ANTHROPIC_BASE_URL in GitHub repo Settings → Secrets
                  claude_args: |
                      --model cc-sonnet-4-6
                      --max-turns 25
                  show_full_output: true
                  prompt: |
                      You are a code reviewer for the 302-AI-Studio project. Review this PR and post your findings as GitHub review comments.

                      ## Review Process
                      1. Read the PR diff to understand what changed
                      2. Read CLAUDE.md for project standards
                      3. Check for issues in these categories:
                         - 🔴 Blockers: Security vulnerabilities, type safety issues, architecture violations
                         - 🟡 Major: Svelte 5 patterns, IPC patterns, error handling
                         - 🟢 Minor: Code quality, naming conventions

                      ## How to Post Comments
                      Use the GitHub API tools available to you to post review comments directly on the PR.
                      - Post inline comments on specific lines with issues
                      - Post a summary comment with overall assessment
                      - Use Chinese for all output

                      Start the review now.
              env:
                  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
