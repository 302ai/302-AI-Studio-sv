name: AI Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened]
        # Trigger on PRs targeting dev/* branches
        branches:
            - "dev/*"

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    claude-code-review:
        runs-on: ubuntu-latest
        # Only review PRs from feature branches, skip dependabot and automated PRs
        # Supported branch prefixes: feat/ fix/ refactor/ perf/ docs/ style/ test/ chore/ ci/ build/
        if: |
            !startsWith(github.head_ref, 'dev/') &&
            !startsWith(github.head_ref, 'develop') &&
            !startsWith(github.head_ref, 'master') &&
            !startsWith(github.head_ref, 'release/') &&
            github.actor != 'dependabot[bot]'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
              env:
                  NODE_OPTIONS: --max-old-space-size=8192

            - name: Run AI Code Review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Use third-party API endpoint (e.g., 302.AI proxy)
                  # Set ANTHROPIC_BASE_URL in GitHub repo Settings → Secrets
                  claude_args: |
                      --model cc-sonnet-4-6
                      --max-turns 25
                      --allowedTools "Read,Grep,Glob,Bash(pnpm check),Bash(pnpm lint),Bash(pnpm exec svelte-check)"
                      --disallowedTools "Edit,Write,Replace,NotebookEditCell"
                  # Use /review command - it will automatically read CLAUDE.md for project standards
                  prompt: "/review"
              env:
                  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
