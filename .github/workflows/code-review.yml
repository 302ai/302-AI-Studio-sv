name: AI Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened]
        # Trigger on PRs targeting dev/* branches
        branches:
            - "dev/*"

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    claude-code-review:
        runs-on: ubuntu-latest
        # Only review PRs from feature branches, skip dependabot and automated PRs
        # Supported branch prefixes: feat/ fix/ refactor/ perf/ docs/ style/ test/ chore/ ci/ build/
        if: |
            !startsWith(github.head_ref, 'dev/') &&
            !startsWith(github.head_ref, 'develop') &&
            !startsWith(github.head_ref, 'master') &&
            !startsWith(github.head_ref, 'release/') &&
            github.actor != 'dependabot[bot]'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
              env:
                  NODE_OPTIONS: --max-old-space-size=8192

            - name: Run AI Code Review
              id: claude_review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Use third-party API endpoint (e.g., 302.AI proxy)
                  # Set ANTHROPIC_BASE_URL in GitHub repo Settings → Secrets
                  claude_args: |
                      --model cc-sonnet-4-6
                      --max-turns 25
                  show_full_output: true
                  prompt: |
                      You are a code reviewer for the 302-AI-Studio project. Review this PR.

                      ## Review Process
                      1. Read the PR diff: git diff HEAD~1 HEAD
                      2. Read CLAUDE.md for project standards
                      3. Check for issues in these categories:
                         - 🔴 Blockers: Security vulnerabilities, type safety issues, architecture violations
                         - 🟡 Major: Svelte 5 patterns, IPC patterns, error handling
                         - 🟢 Minor: Code quality, naming conventions

                      ## Output Format
                      Provide your review in markdown format with:
                      - Summary of changes
                      - Issues found (categorized by severity)
                      - Recommendations
                      - Use English for all output

                      Your output will be posted as a PR comment automatically.
              env:
                  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

            - name: Post Review Comment
              if: always()
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const logPath = '/home/runner/work/_temp/claude-execution-output.json';

                      let reviewContent = '';
                      let foundContent = false;
                      let debugInfo = [];

                      try {
                          if (fs.existsSync(logPath)) {
                              const logData = fs.readFileSync(logPath, 'utf8');
                              const lines = logData.trim().split('\n');
                              debugInfo.push(`Total lines: ${lines.length}`);

                              // Parse all lines and look for result type only
                              for (const line of lines) {
                                  try {
                                      const msg = JSON.parse(line);

                                      // Debug: log message types found
                                      if (msg.type === 'result') {
                                          debugInfo.push(`Found result type, subtype: ${msg.subtype}, has result: ${!!msg.result}, result type: ${typeof msg.result}, length: ${msg.result?.length || 0}`);
                                      }

                                      // Check for result type (final output)
                                      if (msg.type === 'result' &&
                                          msg.subtype === 'success' &&
                                          msg.result &&
                                          typeof msg.result === 'string' &&
                                          msg.result.length > 50) {
                                          reviewContent = msg.result;
                                          foundContent = true;
                                          debugInfo.push('Successfully extracted review content');
                                          break; // Found the final result, stop searching
                                      }
                                  } catch (e) {
                                      // Skip invalid JSON lines
                                  }
                              }
                          } else {
                              reviewContent = `❌ Log file not found: ${logPath}`;
                          }
                      } catch (error) {
                          reviewContent = `❌ Failed to read review results\n\nError: ${error.message}`;
                      }

                      if (!foundContent) {
                          reviewContent = `⚠️ No review content found\n\nPlease check if Claude Code completed the review successfully.\n\nDebug info:\n${debugInfo.join('\n')}\nLog file path: ${logPath}`;
                      }

                      // Add header if not already present
                      const finalContent = reviewContent.includes('🤖 AI Code Review')
                          ? reviewContent
                          : '## 🤖 AI Code Review\n\n' + reviewContent;

                      // Post the comment
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: finalContent
                      });
