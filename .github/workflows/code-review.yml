name: AI Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened]
        # Trigger on PRs targeting dev/* branches
        branches:
            - "dev/*"

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    claude-code-review:
        runs-on: ubuntu-latest
        # Only review PRs from feature branches, skip dependabot and automated PRs
        # Supported branch prefixes: feat/ fix/ refactor/ perf/ docs/ style/ test/ chore/ ci/ build/
        if: |
            !startsWith(github.head_ref, 'dev/') &&
            !startsWith(github.head_ref, 'develop') &&
            !startsWith(github.head_ref, 'master') &&
            !startsWith(github.head_ref, 'release/') &&
            github.actor != 'dependabot[bot]'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
              env:
                  NODE_OPTIONS: --max-old-space-size=8192

            - name: Run AI Code Review
              id: claude_review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Use third-party API endpoint (e.g., 302.AI proxy)
                  # Set ANTHROPIC_BASE_URL in GitHub repo Settings → Secrets
                  claude_args: |
                      --model cc-sonnet-4-6
                      --max-turns 25
                  show_full_output: true
                  prompt: |
                      You are a code reviewer for the 302-AI-Studio project. Review this PR.

                      ## Review Process
                      1. Read the PR diff: git diff HEAD~1 HEAD
                      2. Read CLAUDE.md for project standards
                      3. Check for issues in these categories:
                         - 🔴 Blockers: Security vulnerabilities, type safety issues, architecture violations
                         - 🟡 Major: Svelte 5 patterns, IPC patterns, error handling
                         - 🟢 Minor: Code quality, naming conventions

                      ## Output Format
                      Provide your review in markdown format with:
                      - Summary of changes
                      - Issues found (categorized by severity)
                      - Recommendations
                      - Use Chinese for all output

                      Your output will be posted as a PR comment automatically.
              env:
                  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

            - name: Post Review Comment
              if: always()
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const fs = require('fs');
                      const logPath = '/home/runner/work/_temp/claude-execution-output.json';

                      let reviewContent = '## 🤖 AI Code Review\n\n';

                      try {
                          if (fs.existsSync(logPath)) {
                              const logData = fs.readFileSync(logPath, 'utf8');
                              const lines = logData.trim().split('\n');

                              // Find the result message with the review content
                              for (const line of lines) {
                                  try {
                                      const msg = JSON.parse(line);
                                      if (msg.type === 'assistant' && msg.message?.content) {
                                          for (const content of msg.message.content) {
                                              if (content.type === 'text' && content.text) {
                                                  reviewContent += content.text + '\n\n';
                                              }
                                          }
                                      }
                                  } catch (e) {
                                      // Skip invalid JSON lines
                                  }
                              }
                          }
                      } catch (error) {
                          reviewContent += '❌ 无法读取审查结果\n\n';
                          reviewContent += `错误: ${error.message}`;
                      }

                      // Post the comment
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: reviewContent
                      });
